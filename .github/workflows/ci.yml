name: AKURU CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-playbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Ubuntu playbook shell syntax
        run: bash -n deploy/ubuntu/install-prerequisites.sh deploy/ubuntu/verify-prerequisites.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source-code/frontend/package-lock.json
      - run: npm ci
        working-directory: source-code/frontend
      - run: npm run test:frontend
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: akuru
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d akuru"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: source-code/backend
    env:
      AKURU_ENVIRONMENT: test
      AKURU_DATABASE_HOST: 127.0.0.1
      AKURU_DATABASE_PORT: 5432
      AKURU_DATABASE_NAME: akuru
      AKURU_DATABASE_USER: postgres
      AKURU_DATABASE_PASSWORD: ci-only-password
      AKURU_CORS_ORIGINS: '["http://localhost"]'
      AKURU_ALLOWED_HOSTS: '["localhost","testserver"]'
      AKURU_COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - name: Install document extraction system tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-code/backend/requirements*.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/alembic upgrade head
      - run: .venv/bin/alembic check
      - run: .venv/bin/python -m app.generate_api_contract --check
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m app.database_maintenance restore-drill
